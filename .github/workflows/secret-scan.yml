name: Secret scan

# Memakai CLI gitleaks langsung (lisensi MIT) — BUKAN gitleaks-action.
# Alasan: gitleaks-action mewajibkan GITLEAKS_LICENSE bila tipe akun terdeteksi
# "Organization" ATAU bila panggilan API pengecekan tipe akun gagal, sehingga job
# bisa gagal karena lisensi. CLI tidak punya pengecekan lisensi sama sekali.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # mingguan, Senin 03:17 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # pindai seluruh riwayat
      - name: Pasang gitleaks (versi & checksum dipin)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Pindai riwayat git
        # --redact: nilai yang cocok tidak dicetak ke log (log repo publik bisa dibaca semua orang).
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
