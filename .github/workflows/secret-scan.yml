name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # mingguan, Senin 03:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # pindai seluruh riwayat
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hanya wajib bila repo milik organisasi (lisensi gratis dari gitleaks.io).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
