<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1513" />
    <meta
      name="description"
      content="E-Logbook SPU — logbook digital penyimpanan sementara limbah B3."
    />
    <title>E-Logbook SPU</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Terapkan tema tersimpan sebelum render agar tidak berkedip.
      try {
        var t = localStorage.getItem('spu-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>E-Logbook SPU membutuhkan JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
